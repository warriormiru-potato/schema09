<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공식암기도우미 by 서정원</title>

<!-- MathJax 설정 및 스크립트 로드 -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']]
  },
  svg: {
    fontCache: 'global'
  },
  startup: {
    pageReady: () => {
      return MathJax.startup.defaultPageReady().then(() => {
        if (typeof render === 'function') {
          render();
        }
      });
    }
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*{box-sizing:border-box} 
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f6fb;color:#182033}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:26px;margin:8px 0}
.sub{color:#687086;margin-bottom:16px}
.panel{background:white;border-radius:18px;padding:16px;box-shadow:0 5px 20px #0000000d;margin-bottom:14px}
.select-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
select{width:100%;background:#eef1f7}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button{white-space:nowrap;background:#eef1f7;flex:1}
.tabs button.on{background:#182033;color:white}
.card{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:2px solid #e6e9f0;border-radius:18px;padding:28px 20px;position:relative}
.badge{position:absolute;top:14px;left:14px;font-size:13px;color:#667085}
.card-img{max-width:100%;max-height:180px;border-radius:8px;margin-bottom:12px;object-fit:contain;display:none}
.q{font-size:20px;font-weight:750;line-height:1.5}
.a{font-size:22px;font-weight:800;line-height:1.5;color:#1d2939}
.unit-tag{color:#3b82f6;font-weight:800;margin-right:6px}
.hint{color:#7b8498;font-size:13px;margin-top:10px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{font-weight:700}
.wrong{background:#ffe7e7}
.right{background:#e3f7eb}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.score{font-weight:750}
.small{font-size:13px;color:#70798d}
.symbol-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:8px;margin-top:10px}
@media(max-width:500px){.select-group{grid-template-columns:1fr}.q{font-size:17px}.a{font-size:19px}.card{min-height:320px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>공식암기도우미 by 서정원</h1>
  <div class="sub">물리 및 화학 주요 공식 카드</div>

  <div class="panel">
    <div class="select-group">
      <select id="subjectSelect"></select>
      <select id="unitSelect"></select>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="panel">
    <div class="card" id="card" onclick="flip()">
      <div class="badge" id="badge"></div>
      <img id="cardImg" class="card-img" alt="문제 상황 이미지" onerror="this.style.display='none'">
      <div id="content"></div>
    </div>
    <div class="hint">카드를 클릭하면 정답이 보입니다.</div>
    <div class="actions">
      <button class="right" onclick="known()">아는거다</button>
      <button class="wrong" onclick="hold()">몰랐다</button>
    </div>
    <div class="row">
      <span class="score" id="score">정답 0 / 0</span>
      <span class="small"></span>
    </div>
  </div>

  <div class="panel small">
    <b>주요 기호 정리</b>
    <div id="symbols" class="symbol-grid"></div>
  </div>
</div>

<script>
// 데이터 구조: [단원, 질문 문장, 정답 문장, 이미지경로(선택)]
const physicsData = [
  // 1. 빗면에서의 운동
  ["빗면 운동", "마찰이 없는 빗면에 놓인 물체에 작용하는 중력 성분 중 수직 항력과 평형을 이루는 힘은?", "\\(mg\\cos\\theta\\) (중력의 y성분)"],
  ["빗면 운동", "마찰이 없는 빗면 위의 물체에 작용하는 알짜힘과 이 물체의 운동 형태는?", "알짜힘: \\(mg\\sin\\theta\\)<br>운동: 등가속도 운동"],
  ["빗면 운동", "마찰을 무시할 수 있는 빗면을 미끄러져 내려가는 물체의 가속도 공식은?", "\\(a = g\\sin\\theta\\)"],
  ["빗면 운동", "마찰이 존재하는 빗면 위의 물체에 작용하는 3가지 힘은?", "중력, 수직 항력, 마찰력"],
  ["빗면 운동", "마찰이 있는 빗면에서 운동하는 물체의 알짜힘 식은?", "\\(mg\\sin\\theta - f\\)"],
  ["빗면 운동", "마찰이 있는 빗면에서 \\(mg\\sin\\theta > f\\) 조건일 때 물체의 운동 상태는?", "등가속도 운동"],
  ["빗면 운동", "마찰이 있는 빗면에서 \\(mg\\sin\\theta = f\\) 조건일 때 물체의 운동 상태는?", "정지 상태 유지 또는 등속도 운동"],
  ["빗면 운동", "마찰이 존재하는 빗면을 따라 내려가는 물체의 가속도 공식은?", "\\(a = \\frac{mg\\sin\\theta - f}{m}\\)"],

  // 2. 연결된 물체의 운동
  ["연결된 물체", "수평 탁자 위의 물체 A와 실로 연결되어 매달린 B가 함께 움직일 때 가속도는?", "\\(a = \\frac{m_B}{m_A + m_B}g\\)"],
  ["연결된 물체", "수평 탁자 위 A와 매달린 B가 연결된 계에서 물체 A에 작용하는 알짜힘은?", "\\(F_A = \\frac{m_A m_B}{m_A + m_B}g\\)"],
  ["연결된 물체", "수평 탁자 위 A와 매달린 B가 연결된 계에서 물체 B에 작용하는 알짜힘은?", "\\(F_B = \\frac{m_B^2}{m_A + m_B}g\\)"],
  ["연결된 물체", "도르래에 연결된 두 물체 A, B(\\(m_B > m_A\\))에 작용하는 전체 알짜힘의 크기는?", "\\((m_B - m_A)g\\)"],
  ["연결된 물체", "도르래에 매달려 함께 운동하는 두 물체 A, B(\\(m_B > m_A\\))의 가속도는?", "\\(a = \\frac{m_B - m_A}{m_A + m_B}g\\)"],
  ["연결된 물체", "빗면의 물체 A와 도르래로 매달린 물체 B가 연결된 계의 가속도 공식은?", "\\(a = \\frac{m_B - m_A\\sin\\theta}{m_A + m_B}g\\)"],

  // 3. 자유 낙하 및 연직 상방 운동
  ["낙하/상방", "자유 낙하하는 물체에 작용하는 알짜힘과 가속도는? (아래쪽을 +로 설정)", "알짜힘: \\(mg\\), 가속도: \\(g\\)"],
  ["낙하/상방", "자유 낙하 운동 시 시간에 따른 속력(\\(v\\))과 낙하 거리(\\(-h\\)) 공식은?", "\\(v = gt\\), \\(h = \\frac{1}{2}gt^2\\)"],
  ["낙하/상방", "자유 낙하 운동의 위치-시간 그래프에서 위치 변화와 시간의 비례 관계는?", "위치는 [ 시간의 제곱(\\(t^2\\)) ]에 비례하여 증가합니다."],
  ["낙하/상방", "연직 위로 던진 물체에 작용하는 알짜힘과 가속도는? (위쪽을 +로 설정)", "알짜힘: \\(-mg\\), 가속도: \\(-g\\)"],
  ["낙하/상방", "연직 위로 던진 물체의 속도(\\(-v\\))와 높이(\\(-h\\)) 공식은?", "\\(v = v_0 - gt\\), \\(h = v_0 t - \\frac{1}{2}gt^2\\)"],
  ["낙하/상방", "연직 위로 던진 물체의 속력과 높이 사이의 관계식은?", "\\(v^2 - v_0^2 = -2gh\\)"],
  ["낙하/상방", "연직 위로 던져진 물체가 최고점에 도달했을 때 순간 속도는?", "\\(v = 0\\)"],

  // 4. 진자 운동 및 경사진 곡선 도로
  ["진자 운동", "진자 운동의 정의와 운동하는 추에 작용하는 두 가지 힘은?", "줄에 매달린 추가 왕복하는 운동이며, [ 중력(mg) ]과 [ 실의 장력(T) ]이 작용합니다."],
  ["진자 운동", "진자 운동에서 장력이 최소가 되는 위치와 이때 알짜힘의 크기는?", "최고점(A, E)에서 장력이 최소가 되며, 알짜힘은 [ 최대 ]입니다."],
  ["진자 운동", "진자 운동에서 장력이 최대가 되는 위치와 이때 알짜힘의 크기는?", "최저점(C)에서 장력이 최대가 되며, 알짜힘은 [ 최소(0) ]입니다."],
  ["곡선 도로", "경사각 \\(\\theta\\)인 곡선 도로를 도는 자동차의 구심력 방정식은?", "\\(F_N \\sin\\theta = \\frac{mv^2}{r} = mg\\tan\\theta\\)"],
  ["곡선 도로", "마찰이 없는 경사 도로에서 자동차가 미끄러지지 않고 돌 수 있는 안전 속력은?", "\\(v = \\sqrt{gr\\tan\\theta}\\)"],

  // 5. 좌표계 및 관성력
  ["좌표계", "3차원 공간에서 위치를 나타내기 위해 주로 사용되는 3가지 좌표계는?", "직교좌표계(x, y, z), 극좌표계(r, θ, ϕ), 원통좌표계(r, ϕ, z)"],
  ["관성력", "가속도 \\(a\\)로 운동하는 가속 좌표계 내에서 관찰되는 관성력 공식은?", "\\(\\vec{f} = -m\\vec{a}\\) (가속도와 반대 방향)"],
  ["관성력 예시", "가속도 \\(a\\)로 위쪽으로 가속 승강하는 엘리베이터 안에서의 체감 무게는?", "\\(w = m(g + a)\\)"],
  ["관성력 예시", "가속도 \\(a\\)로 아래쪽으로 가속 하강하는 엘리베이터 안에서의 체감 무게는?", "\\(w = m(g - a)\\)"],
  ["관성력 예시", "줄이 끊어져 자유 낙하하는 엘리베이터 내부의 관찰자가 느끼는 체감 무게는?", "무중력 상태 (체감 무게 \\(w = 0\\))"],
  ["전향력", "지구 자전에 의해 북반구에서 이동하는 물체가 받는 코리올리 힘의 방향은?", "진행 방향의 [ 오른쪽 ] 방향"],

  // 6. 상대성이론 및 블랙홀
  ["질량/상대성", "운동 가속도로 구하는 관성 질량과 중력장 크기로 구하는 중력 질량의 관계는?", "아인슈타인의 등가원리에 의해 관성 질량과 중력 질량은 동일합니다."],
  ["상대성이론", "아인슈타인의 등가원리 핵심 개념은?", "가속 운동 좌표계 내에서의 현상과 중력장 내에서의 현상은 서로 구분할 수 없다."],
  ["블랙홀", "블랙홀의 경계면으로 빛조차 탈출할 수 없는 한계 영역을 무엇이라 하는가?", "사건의 지평선(Event Horizon)"],
  ["슈바르츠실트", "질량 M인 천체의 슈바르츠실트 반지름(\\(R_s\\)) 공식은?", "\\(R_s = \\frac{2GM}{c^2}\\)"]
];

const chemistryData = [
  ["기체 법칙", "온도가 일정할 때 기체 부피와 압력의 관계식(보일의 법칙)은?", "\\(V \\propto \\frac{1}{P}\\)"],
  ["기체 법칙", "압력이 일정할 때 기체 부피와 절대온도의 관계식(샤를의 법칙)은?", "\\(V \\propto T\\)"],
  ["기체 법칙", "이상기체 상태 방정식의 기본 공식은?", "\\(PV = nRT\\)"],
  ["기체 법칙", "이상기체 상태 방정식을 변형하여 분자량(M)을 구하는 공식은?", "\\(M = \\frac{wRT}{PV}\\)"],
  ["액체·상평형", "고체, 액체, 기체 세 가지 상이 함께 존재하여 평형을 이루는 지점은?", "삼중점 (Triple Point)"],
  ["묽은 용액", "용액의 끓는점 오름(\\(\\Delta T_b\\))을 구하는 공식은?", "\\(\\Delta T_b = K_b \\cdot m \\cdot i\\)"],
  ["묽은 용액", "용액의 어는점 내림(\\(\\Delta T_f\\))을 구하는 공식은?", "\\(\\Delta T_f = K_f \\cdot m \\cdot i\\)"],
  ["묽은 용액", "용액의 삼투압(\\(\\pi\\))을 구하는 반트 호프 공식은?", "\\(\\pi = CRT\\)"]
];

const physicsSymbols = {
  "θ":"경사각 / 각도","f":"마찰력 / 관성력","F_N":"수직 항력","a":"가속도",
  "g":"중력가속도","h":"높이 / 변위","v_0":"초기 속도","T":"장력 / 주기",
  "m_i":"관성 질량","m_g":"중력 질량","R_s":"슈바르츠실트 반지름","c":"빛의 속도",
  "G":"만유인력 상수","ω":"각속도","r":"반지름 / 거리"
};

const chemistrySymbols = {
  "P":"압력","V":"부피","T":"절대온도(K)","n":"몰수(mol)","R":"기체상수",
  "M":"분자량 / 몰농도","m":"몰랄농도","π":"삼투압","K_b":"끓는점 오름 상수","K_f":"어는점 내림 상수"
};

const subjects = {
  "물리": { data: physicsData, symbols: physicsSymbols },
  "화학": { data: chemistryData, symbols: chemistrySymbols }
};

let currentSubject = "물리";
let currentUnit = "ALL";
let deck = [], idx = 0, flipped = false, correct = 0, answered = 0;

const selectSubEl = document.getElementById("subjectSelect");
const selectUnitEl = document.getElementById("unitSelect");
const tabsEl = document.getElementById("tabs");
const imgEl = document.getElementById("cardImg");

// 과목 선택 드롭다운 설정
Object.keys(subjects).forEach(sub => {
  let opt = document.createElement("option");
  opt.value = sub;
  opt.textContent = sub;
  selectSubEl.appendChild(opt);
});

selectSubEl.onchange = (e) => {
  currentSubject = e.target.value;
  currentUnit = "ALL";
  buildTabs();
  buildUnitSelect();
  reset();
};

selectUnitEl.onchange = (e) => {
  currentUnit = e.target.value;
  reset();
};

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(subjects).forEach(sub => {
    let btn = document.createElement("button");
    btn.textContent = sub;
    btn.className = sub === currentSubject ? "on" : "";
    btn.onclick = () => {
      currentSubject = sub;
      currentUnit = "ALL";
      selectSubEl.value = sub;
      buildTabs();
      buildUnitSelect();
      reset();
    };
    tabsEl.appendChild(btn);
  });
}

function buildUnitSelect(){
  selectUnitEl.innerHTML = "";
  
  let allOpt = document.createElement("option");
  allOpt.value = "ALL";
  allOpt.textContent = "전체 단원 모드";
  selectUnitEl.appendChild(allOpt);

  const units = [...new Set(subjects[currentSubject].data.map(item => item[0]))];
  units.forEach(unit => {
    let opt = document.createElement("option");
    opt.value = unit;
    opt.textContent = unit;
    selectUnitEl.appendChild(opt);
  });

  selectUnitEl.value = currentUnit;
}

function reset(){
  let sourceData = subjects[currentSubject].data;
  if(currentUnit !== "ALL"){
    sourceData = sourceData.filter(item => item[0] === currentUnit);
  }

  deck = JSON.parse(JSON.stringify(sourceData));
  shuffle(deck);
  idx = 0;
  flipped = false;
  correct = 0;
  answered = 0;
  
  const syms = subjects[currentSubject].symbols;
  document.getElementById("symbols").innerHTML = Object.entries(syms)
    .map(([k,v]) => `<div><b>${k}</b> : ${v}</div>`).join("");
    
  render();
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render(){
  if(!deck.length) {
    document.getElementById("content").innerHTML = "<div>해당 단원에 문제가 없습니다.</div>";
    document.getElementById("badge").textContent = "";
    document.getElementById("score").textContent = "정답 0 / 0";
    imgEl.style.display = "none";
    return;
  }
  
  let [unit, topic, answer, imgSrc] = deck[idx];
  document.getElementById("badge").textContent = currentSubject + " (" + (currentUnit === "ALL" ? "전체" : currentUnit) + ") · " + (idx + 1) + "/" + deck.length;
  
  // 이미지가 유효하게 있는 경우에만 표시
  if(imgSrc && imgSrc.trim() !== ""){
    imgEl.src = imgSrc;
    imgEl.style.display = "block";
  } else {
    imgEl.style.display = "none";
    imgEl.removeAttribute("src");
  }

  let question = `<span class="unit-tag">[${unit}]</span>${topic}`;
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = flipped ? `<div class="a">${answer}</div>` : `<div class="q">${question}</div>`;
  document.getElementById("score").textContent = `정답 ${correct} / ${answered}`;
  
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([contentEl]).catch((err) => console.log(err));
  }
}

function flip(){
  if(!deck.length) return;
  flipped = !flipped;
  render();
}

function next(){
  if(!deck.length) return;
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
}

function known(){
  if(!deck.length) return;
  answered++;
  correct++;
  next();
}

function hold(){
  if(!deck.length) return;
  answered++;
  let current = deck[idx];
  deck.splice(idx, 1);
  deck.push(current);
  if(idx >= deck.length) idx = 0;
  flipped = false;
  render();
}

// 초기화
buildTabs();
buildUnitSelect();
reset();

<script>
// 데이터 구조: [단원, 질문 문장, 정답 문장, 이미지경로(선택)]
const physicsData = [
  // 1. 빗면에서의 운동
  ["빗면 운동", "마찰이 없는 빗면에 놓인 물체에 작용하는 중력 성분 중 수직 항력과 평형을 이루는 힘은?", "\\(mg\\cos\\theta\\) (중력의 y성분)"],

  ["빗면 운동", "마찰을 무시할 수 있는 빗면을 미끄러져 내려가는 물체의 가속도 공식은?", "\\(a = g\\sin\\theta\\)"],
  ["빗면 운동", "마찰이 존재하는 빗면 위의 물체에 작용하는 3가지 힘은?", "중력, 수직 항력, 마찰력"],
  ["빗면 운동", "마찰이 있는 빗면에서 운동하는 물체의 알짜힘 식은?", "\\(mg\\sin\\theta - f\\)"],
  ["빗면 운동", "마찰이 있는 빗면에서 \\(mg\\sin\\theta > f\\) 조건일 때 물체의 운동 상태는?", "등가속도 운동"],
  ["빗면 운동", "마찰이 있는 빗면에서 \\(mg\\sin\\theta = f\\) 조건일 때 물체의 운동 상태는?", "정지 상태 유지 또는 등속도 운동"],
  ["빗면 운동", "마찰이 존재하는 빗면을 따라 내려가는 물체의 가속도 공식은?", "\\(a = \\frac{mg\\sin\\theta - f}{m}\\)"],

  // 2. 연결된 물체의 운동
  ["연결된 물체", "수평 탁자 위의 물체 A와 실로 연결되어 매달린 B가 함께 움직일 때 가속도는?", "\\(a = \\frac{m_B}{m_A + m_B}g\\)"],
  ["연결된 물체", "수평 탁자 위 A와 매달린 B가 연결된 계에서 물체 A에 작용하는 알짜힘은?", "\\(F_A = \\frac{m_A m_B}{m_A + m_B}g\\)"],
  ["연결된 물체", "수평 탁자 위 A와 매달린 B가 연결된 계에서 물체 B에 작용하는 알짜힘은?", "\\(F_B = \\frac{m_B^2}{m_A + m_B}g\\)"],
  ["연결된 물체", "도르래에 연결된 두 물체 A, B(\\(m_B > m_A\\))에 작용하는 전체 알짜힘의 크기는?", "\\((m_B - m_A)g\\)"],
  ["연결된 물체", "도르래에 매달려 함께 운동하는 두 물체 A, B(\\(m_B > m_A\\))의 가속도는?", "\\(a = \\frac{m_B - m_A}{m_A + m_B}g\\)"],
  ["연결된 물체", "빗면의 물체 A와 도르래로 매달린 물체 B가 연결된 계의 가속도 공식은?", "\\(a = \\frac{m_B - m_A\\sin\\theta}{m_A + m_B}g\\)"],

  // 3. 자유 낙하 및 연직 상방 운동
  ["낙하/상방", "자유 낙하하는 물체에 작용하는 알짜힘과 가속도는? (아래쪽을 +로 설정)", "알짜힘: \\(mg\\), 가속도: \\(g\\)"],
  ["낙하/상방", "자유 낙하 운동 시 시간에 따른 속력(\\(v\\))과 낙하 거리(\\(-h\\)) 공식은?", "\\(v = gt\\), \\(h = \\frac{1}{2}gt^2\\)"],
  ["낙하/상방", "자유 낙하 운동의 위치-시간 그래프에서 위치 변화와 시간의 비례 관계는?", "위치는 [ 시간의 제곱(\\(t^2\\)) ]에 비례하여 증가합니다."],
  ["낙하/상방", "연직 위로 던진 물체에 작용하는 알짜힘과 가속도는? (위쪽을 +로 설정)", "알짜힘: \\(-mg\\), 가속도: \\(-g\\)"],
  ["낙하/상방", "연직 위로 던진 물체의 속도(\\(-v\\))와 높이(\\(-h\\)) 공식은?", "\\(v = v_0 - gt\\), \\(h = v_0 t - \\frac{1}{2}gt^2\\)"],
  ["낙하/상방", "연직 위로 던진 물체의 속력과 높이 사이의 관계식은?", "\\(v^2 - v_0^2 = -2gh\\)"],
  ["낙하/상방", "연직 위로 던져진 물체가 최고점에 도달했을 때 순간 속도는?", "\\(v = 0\\)"],

  // 4. 진자 운동 및 경사진 곡선 도로
  ["진자 운동", "진자 운동의 정의와 운동하는 추에 작용하는 두 가지 힘은?", "줄에 매달린 추가 왕복하는 운동이며, [ 중력(mg) ]과 [ 실의 장력(T) ]이 작용합니다."],
  ["진자 운동", "진자 운동에서 장력이 최소가 되는 위치와 이때 알짜힘의 크기는?", "최고점(A, E)에서 장력이 최소가 되며, 알짜힘은 [ 최대 ]입니다."],
  ["진자 운동", "진자 운동에서 장력이 최대가 되는 위치와 이때 알짜힘의 크기는?", "최저점(C)에서 장력이 최대가 되며, 알짜힘은 [ 최소(0) ]입니다."],
  ["곡선 도로", "경사각 \\(\\theta\\)인 곡선 도로를 도는 자동차의 구심력 방정식은?", "\\(F_N \\sin\\theta = \\frac{mv^2}{r} = mg\\tan\\theta\\)"],
  ["곡선 도로", "마찰이 없는 경사 도로에서 자동차가 미끄러지지 않고 돌 수 있는 안전 속력은?", "\\(v = \\sqrt{gr\\tan\\theta}\\)"],

  // 5. 좌표계 및 관성력
  ["좌표계", "3차원 공간에서 위치를 나타내기 위해 주로 사용되는 3가지 좌표계는?", "직교좌표계(x, y, z), 극좌표계(r, θ, ϕ), 원통좌표계(r, ϕ, z)"],
  ["관성력", "가속도 \\(a\\)로 운동하는 가속 좌표계 내에서 관찰되는 관성력 공식은?", "\\(\\vec{f} = -m\\vec{a}\\) (가속도와 반대 방향)"],
  ["관성력 예시", "가속도 \\(a\\)로 위쪽으로 가속 승강하는 엘리베이터 안에서의 체감 무게는?", "\\(w = m(g + a)\\)"],
  ["관성력 예시", "가속도 \\(a\\)로 아래쪽으로 가속 하강하는 엘리베이터 안에서의 체감 무게는?", "\\(w = m(g - a)\\)"],
  ["관성력 예시", "줄이 끊어져 자유 낙하하는 엘리베이터 내부의 관찰자가 느끼는 체감 무게는?", "무중력 상태 (체감 무게 \\(w = 0\\))"],
  ["전향력", "지구 자전에 의해 북반구에서 이동하는 물체가 받는 코리올리 힘의 방향은?", "진행 방향의 [ 오른쪽 ] 방향"],

  // 6. 상대성이론 및 블랙홀
  ["질량/상대성", "운동 가속도로 구하는 관성 질량과 중력장 크기로 구하는 중력 질량의 관계는?", "아인슈타인의 등가원리에 의해 관성 질량과 중력 질량은 동일합니다."],
  ["상대성이론", "아인슈타인의 등가원리 핵심 개념은?", "가속 운동 좌표계 내에서의 현상과 중력장 내에서의 현상은 서로 구분할 수 없다."],
  ["블랙홀", "블랙홀의 경계면으로 빛조차 탈출할 수 없는 한계 영역을 무엇이라 하는가?", "사건의 지평선(Event Horizon)"],
  ["슈바르츠실트", "질량 M인 천체의 슈바르츠실트 반지름(\\(R_s\\)) 공식은?", "\\(R_s = \\frac{2GM}{c^2}\\)"]
];

const chemistryData = [
  ["기체 법칙", "온도가 일정할 때 기체 부피와 압력의 관계식(보일의 법칙)은?", "\\(V \\propto \\frac{1}{P}\\)"],
  ["기체 법칙", "압력이 일정할 때 기체 부피와 절대온도의 관계식(샤를의 법칙)은?", "\\(V \\propto T\\)"],
  ["기체 법칙", "이상기체 상태 방정식의 기본 공식은?", "\\(PV = nRT\\)"],
  ["기체 법칙", "이상기체 상태 방정식을 변형하여 분자량(M)을 구하는 공식은?", "\\(M = \\frac{wRT}{PV}\\)"],
  ["액체·상평형", "고체, 액체, 기체 세 가지 상이 함께 존재하여 평형을 이루는 지점은?", "삼중점 (Triple Point)"],
  ["묽은 용액", "용액의 끓는점 오름(\\(\\Delta T_b\\))을 구하는 공식은?", "\\(\\Delta T_b = K_b \\cdot m \\cdot i\\)"],
  ["묽은 용액", "용액의 어는점 내림(\\(\\Delta T_f\\))을 구하는 공식은?", "\\(\\Delta T_f = K_f \\cdot m \\cdot i\\)"],
  ["묽은 용액", "용액의 삼투압(\\(\\pi\\))을 구하는 반트 호프 공식은?", "\\(\\pi = CRT\\)"]
];

const physicsSymbols = {
  "θ":"경사각 / 각도","f":"마찰력 / 관성력","F_N":"수직 항력","a":"가속도",
  "g":"중력가속도","h":"높이 / 변위","v_0":"초기 속도","T":"장력 / 주기",
  "m_i":"관성 질량","m_g":"중력 질량","R_s":"슈바르츠실트 반지름","c":"빛의 속도",
  "G":"만유인력 상수","ω":"각속도","r":"반지름 / 거리"
};

const chemistrySymbols = {
  "P":"압력","V":"부피","T":"절대온도(K)","n":"몰수(mol)","R":"기체상수",
  "M":"분자량 / 몰농도","m":"몰랄농도","π":"삼투압","K_b":"끓는점 오름 상수","K_f":"어는점 내림 상수"
};

const subjects = {
  "물리": { data: physicsData, symbols: physicsSymbols },
  "화학": { data: chemistryData, symbols: chemistrySymbols }
};

let currentSubject = "물리";
let currentUnit = "ALL";
let deck = [], idx = 0, flipped = false, correct = 0, answered = 0;

const selectSubEl = document.getElementById("subjectSelect");
const selectUnitEl = document.getElementById("unitSelect");
const tabsEl = document.getElementById("tabs");
const imgEl = document.getElementById("cardImg");

// 과목 선택 드롭다운 설정
Object.keys(subjects).forEach(sub => {
  let opt = document.createElement("option");
  opt.value = sub;
  opt.textContent = sub;
  selectSubEl.appendChild(opt);
});

selectSubEl.onchange = (e) => {
  currentSubject = e.target.value;
  currentUnit = "ALL";
  buildTabs();
  buildUnitSelect();
  reset();
};

selectUnitEl.onchange = (e) => {
  currentUnit = e.target.value;
  reset();
};

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(subjects).forEach(sub => {
    let btn = document.createElement("button");
    btn.textContent = sub;
    btn.className = sub === currentSubject ? "on" : "";
    btn.onclick = () => {
      currentSubject = sub;
      currentUnit = "ALL";
      selectSubEl.value = sub;
      buildTabs();
      buildUnitSelect();
      reset();
    };
    tabsEl.appendChild(btn);
  });
}

function buildUnitSelect(){
  selectUnitEl.innerHTML = "";
  
  let allOpt = document.createElement("option");
  allOpt.value = "ALL";
  allOpt.textContent = "전체 단원 모드";
  selectUnitEl.appendChild(allOpt);

  const units = [...new Set(subjects[currentSubject].data.map(item => item[0]))];
  units.forEach(unit => {
    let opt = document.createElement("option");
    opt.value = unit;
    opt.textContent = unit;
    selectUnitEl.appendChild(opt);
  });

  selectUnitEl.value = currentUnit;
}

function reset(){
  let sourceData = subjects[currentSubject].data;
  if(currentUnit !== "ALL"){
    sourceData = sourceData.filter(item => item[0] === currentUnit);
  }

  deck = JSON.parse(JSON.stringify(sourceData));
  shuffle(deck);
  idx = 0;
  flipped = false;
  correct = 0;
  answered = 0;
  
  const syms = subjects[currentSubject].symbols;
  document.getElementById("symbols").innerHTML = Object.entries(syms)
    .map(([k,v]) => `<div><b>${k}</b> : ${v}</div>`).join("");
    
  render();
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render(){
  if(!deck.length) {
    document.getElementById("content").innerHTML = "<div>해당 단원에 문제가 없습니다.</div>";
    document.getElementById("badge").textContent = "";
    document.getElementById("score").textContent = "정답 0 / 0";
    imgEl.style.display = "none";
    return;
  }
  
  let [unit, topic, answer, imgSrc] = deck[idx];
  document.getElementById("badge").textContent = currentSubject + " (" + (currentUnit === "ALL" ? "전체" : currentUnit) + ") · " + (idx + 1) + "/" + deck.length;
  
  // 이미지가 유효하게 있는 경우에만 표시
  if(imgSrc && imgSrc.trim() !== ""){
    imgEl.src = imgSrc;
    imgEl.style.display = "block";
  } else {
    imgEl.style.display = "none";
    imgEl.removeAttribute("src");
  }

  let question = `<span class="unit-tag">[${unit}]</span>${topic}`;
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = flipped ? `<div class="a">${answer}</div>` : `<div class="q">${question}</div>`;
  document.getElementById("score").textContent = `정답 ${correct} / ${answered}`;
  
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([contentEl]).catch((err) => console.log(err));
  }
}

function flip(){
  if(!deck.length) return;
  flipped = !flipped;
  render();
}

function next(){
  if(!deck.length) return;
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
}

function known(){
  if(!deck.length) return;
  answered++;
  correct++;
  next();
}

function hold(){
  if(!deck.length) return;
  answered++;
  let current = deck[idx];
  deck.splice(idx, 1);
  deck.push(current);
  if(idx >= deck.length) idx = 0;
  flipped = false;
  render();
}

// 초기화
buildTabs();
buildUnitSelect();
reset();
</script>
