<html lang="ko">

<title>물리화학도우미</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f6fb;color:#182033}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:26px;margin:8px 0}.sub{color:#687086;margin-bottom:16px}
.panel{background:white;border-radius:18px;padding:16px;box-shadow:0 5px 20px #0000000d;margin-bottom:14px}
select,button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer}
select{width:100%;background:#eef1f7}.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}.tabs button{white-space:nowrap;background:#eef1f7;flex:1}.tabs button.on{background:#182033;color:white}
.card{min-height:270px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:2px solid #e6e9f0;border-radius:18px;padding:28px;position:relative}
.badge{position:absolute;top:14px;left:14px;font-size:13px;color:#667085}.q{font-size:22px;font-weight:750;line-height:1.5}.a{font-size:25px;font-weight:800;line-height:1.5;color:#1d2939}
.unit-tag{color:#3b82f6;font-weight:800;margin-right:6px}
.hint{color:#7b8498;font-size:13px;margin-top:10px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{font-weight:700}.wrong{background:#ffe7e7}.right{background:#e3f7eb}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.score{font-weight:750}
.small{font-size:13px;color:#70798d}
.symbol-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:8px;margin-top:10px}
@media(max-width:500px){.q{font-size:18px}.a{font-size:21px}.card{min-height:300px}}
</style>
</head>
<body>
<div class="wrap">
<h1>공식암기도우미 by 서정원</h1>
<div class="sub"></div>

<div class="panel">
<select id="subjectSelect"></select>
<div class="tabs" id="tabs"></div>
</div>

<div class="panel">
<div class="card" id="card" onclick="flip()">
<div class="badge" id="badge"></div>
<div id="content"></div>
</div>
<div class="hint"></div>
<div class="actions">
<button class="right" onclick="known()">아는거다</button>
<button class="wrong" onclick="hold()">몰랐다</button>
</div>
<div class="row"><span class="score" id="score">정답 0 / 0</span><span class="small"></span></div>
</div>

<div class="panel small">
<b>주요 기호 정리</b>
<div id="symbols" class="symbol-grid"></div>
</div>
</div>

const physicsSymbols = {

const chemistrySymbols = {
  "P":"압력","V":"부피","T":"절대온도(K)","t":"섭씨온도(℃)","n":"몰수(mol)",
  "R":"기체상수","w":"질량(g)","M":"분자량 / 몰농도","m":"몰랄농도",
  "π":"삼투압","C":"몰농도","i":"반트호프 계수","K_b":"끓는점 오름 상수","K_f":"어는점 내림 상수"
};

const subjects = {
  "물리": { data: physicsData, symbols: physicsSymbols },
  "화학": { data: chemistryData, symbols: chemistrySymbols }
};

let currentSubject = "물리";
let deck = [], idx = 0, flipped = false, correct = 0, answered = 0;

const selectEl = document.getElementById("subjectSelect");
const tabsEl = document.getElementById("tabs");

Object.keys(subjects).forEach(sub => {
  let opt = document.createElement("option");
  opt.value = sub;
  opt.textContent = sub;
  selectEl.appendChild(opt);
});

selectEl.onchange = (e) => {
  currentSubject = e.target.value;
  buildTabs();
  reset();
};

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(subjects).forEach(sub => {
    let btn = document.createElement("button");
    btn.textContent = sub;
    btn.className = sub === currentSubject ? "on" : "";
    btn.onclick = () => {
      currentSubject = sub;
      selectEl.value = sub;
      buildTabs();
      reset();
    };
    tabsEl.appendChild(btn);
  });
}

function reset(){
  deck = JSON.parse(JSON.stringify(subjects[currentSubject].data));
  shuffle(deck);
  idx = 0;
  flipped = false;
  correct = 0;
  answered = 0;
  
  const syms = subjects[currentSubject].symbols;
  document.getElementById("symbols").innerHTML = Object.entries(syms)
    .map(([k,v]) => `<div><b>${k}</b> : ${v}</div>`).join("");
    
  render();
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render(){
  if(!deck.length) return;
  let [unit, topic, answer] = deck[idx];
  document.getElementById("badge").textContent = currentSubject + " · " + (idx + 1) + "/" + deck.length;
  
  let question = `<span class="unit-tag">[${unit}]</span>${topic}`;
  
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = flipped ? `<div class="a">${answer}</div>` : `<div class="q">${question}</div>`;
  document.getElementById("score").textContent = `정답 ${correct} / ${answered}`;
  
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([contentEl]);
  }
}

function flip(){
  flipped = !flipped;
  render();
}

function next(){
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
}

function known(){
  answered++;
  correct++;
  next();
}

function hold(){
  answered++;
  let current = deck[idx];
  deck.splice(idx, 1);
  deck.push(current);
  if(idx >= deck.length) idx = 0;
  flipped = false;
  render();
}

buildTabs();
reset();
</script>
</body>
</html>
