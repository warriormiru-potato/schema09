<div class="wrap">

const physicsSymbols = {
  "F_N":"수직항력","F_a":"관성력","r_s":"슈바르츠실트 반지름","c":"빛의 속도","G":"만유인력 상수",

  "T":"장력(Tension)","N":"수직항력","θ":"경사각","μ_s":"정지 마찰계수","μ_k":"동마찰계수","F_k":"동마찰력",
  "Q":"열량","k":"열전도율","A":"단면적","T₁":"고온","T₂":"저온","t":"시간","l":"길이",
  "l₀":"처음 길이","Δl":"길이 변화량","α":"선팽창계수","ΔT":"온도 변화량","V":"부피","V₀":"처음 부피","β":"부피팽창계수",
  "c":"비열","m":"질량","C":"열용량","L":"잠열","P":"압력","n":"몰수","R":"기체상수",
  "v":"속도","v₀":"처음 속도","a":"가속도","s":"변위","g":"중력가속도","r":"반지름","ω":"각속도","F":"힘","M":"천체 질량","E":"역학적 에너지"
};

const chemistrySymbols = {
  "P":"압력","V":"부피","T":"절대온도(K)","t":"섭씨온도(℃)","n":"몰수(mol)",
  "R":"기체상수","w":"질량(g)","M":"분자량 / 몰농도","m":"몰랄농도",
  "π":"삼투압","C":"몰농도","i":"반트호프 계수","K_b":"끓는점 오름 상수","K_f":"어는점 내림 상수"
};

const subjects = {
  "물리": { data: physicsData, symbols: physicsSymbols },
  "화학": { data: chemistryData, symbols: chemistrySymbols }
};

let currentSubject = "물리";
let deck = [], idx = 0, flipped = false, correct = 0, answered = 0;

const selectEl = document.getElementById("subjectSelect");
const tabsEl = document.getElementById("tabs");

Object.keys(subjects).forEach(sub => {
  let opt = document.createElement("option");
  opt.value = sub;
  opt.textContent = sub;
  selectEl.appendChild(opt);
});

selectEl.onchange = (e) => {
  currentSubject = e.target.value;
  buildTabs();
  reset();
};

function buildTabs(){
  tabsEl.innerHTML = "";
  Object.keys(subjects).forEach(sub => {
    let btn = document.createElement("button");
    btn.textContent = sub;
    btn.className = sub === currentSubject ? "on" : "";
    btn.onclick = () => {
      currentSubject = sub;
      selectEl.value = sub;
      buildTabs();
      reset();
    };
    tabsEl.appendChild(btn);
  });
}

function reset(){
  deck = JSON.parse(JSON.stringify(subjects[currentSubject].data));
  shuffle(deck);
  idx = 0;
  flipped = false;
  correct = 0;
  answered = 0;
  
  const syms = subjects[currentSubject].symbols;
  document.getElementById("symbols").innerHTML = Object.entries(syms)
    .map(([k,v]) => `<div><b>${k}</b> : ${v}</div>`).join("");
    
  render();
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render(){
  if(!deck.length) return;
  let [unit, topic, answer] = deck[idx];
  document.getElementById("badge").textContent = currentSubject + " · " + (idx + 1) + "/" + deck.length;
  
  let question = `<span class="unit-tag">[${unit}]</span>${topic}`;
  
  const contentEl = document.getElementById("content");
  contentEl.innerHTML = flipped ? `<div class="a">${answer}</div>` : `<div class="q">${question}</div>`;
  document.getElementById("score").textContent = `정답 ${correct} / ${answered}`;
  
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([contentEl]).catch((err) => console.log(err));
  }
}

function flip(){
  flipped = !flipped;
  render();
}

function next(){
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
}

function known(){
  answered++;
  correct++;
  next();
}

function hold(){
  answered++;
  let current = deck[idx];
  deck.splice(idx, 1);
  deck.push(current);
  if(idx >= deck.length) idx = 0;
  flipped = false;
  render();
}

// 초기화
buildTabs();
reset();
</script>
